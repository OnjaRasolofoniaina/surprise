<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pour ma Adriana ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none; /* Désactive la sélection de texte sur iPhone */
        }

        body {
            background: radial-gradient(circle, #1a0b2e 0%, #05010d 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            position: relative;
        }

        /* Message central */
        .message-container {
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Pour que les clics passent à travers le texte */
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            line-height: 1.4;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        }

        p {
            font-size: 0.9rem;
            color: #ffb7d2;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Style des cœurs qui apparaissent */
        .heart {
            position: absolute;
            font-size: 24px;
            pointer-events: none; /* Ne bloque pas les clics suivants */
            transform: translate(-50%, -50%);
            animation: floatUp 1.5s ease-out forwards;
            opacity: 0;
        }

        /* Animation de flottement et de disparition */
        @keyframes floatUp {
            0% {
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -150px) scale(1.5) rotate(15deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="message-container">
        <h1>Pour ma femme ma soleil☀️❤️</h1>
        <p>Touche l'écran ✨</p>
    </div>

    <script>
        // Liste d'emojis mignons pour varier un peu
        const emojis = ["❤️", "💖", "✨", "🥰", "🌸", "💌", "🧸"];

        function createHeart(x, y) {
            const heart = document.createElement('span');
            heart.classList.add('heart');
            
            // Choix d'un emoji au hasard dans la liste
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            heart.innerText = randomEmoji;
            
            // Positionnement exact sous le doigt
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            
            // Légère rotation aléatoire pour le style
            const randomRotation = (Math.random() - 0.5) * 30; // entre -15 et 15 deg
            heart.style.setProperty('--rot', randomRotation + 'deg');

            document.body.appendChild(heart);

            // On supprime le cœur du code après l'animation pour ne pas ralentir le téléphone
            setTimeout(() => {
                heart.remove();
            }, 1500);
        }

        // Gérer le clic (PC)
        window.addEventListener('click', (e) => {
            createHeart(e.clientX, e.clientY);
        });

        // Gérer le tactile (iPhone)
        window.addEventListener('touchstart', (e) => {
            // Un utilisateur peut toucher avec plusieurs doigts en même temps !
            for (let i = 0; i < e.touches.length; i++) {
                createHeart(e.touches[i].clientX, e.touches[i].clientY);
            }
        });
    </script>
</body>
</html>
